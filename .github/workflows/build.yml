name: Build macOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build app
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: FileDeck-macOS
          path: build/FileDeck.app
          if-no-files-found: error
